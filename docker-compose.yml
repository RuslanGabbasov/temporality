services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: temporality
      POSTGRES_USER: temporality
      POSTGRES_PASSWORD: temporality
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporality -d temporality"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - temporality-postgres:/var/lib/postgresql/data

  journal:
    build:
      context: .
      target: journal
    environment:
      DATABASE_URL: postgres://temporality:temporality@postgres:5432/temporality?sslmode=disable
      HTTP_ADDR: :8080
      # Bearer auth for the journal API. Empty disables auth (local dev only).
      # Format: "token:subject:role:projects" entries separated by ';' or
      # newlines; projects is '*' or a comma list. Generate: openssl rand -hex 24
      JOURNAL_AUTH_TOKENS: ${JOURNAL_AUTH_TOKENS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  debugger:
    build:
      context: debugger
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      journal:
        condition: service_healthy
      agent-kernel:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:latest
    container_name: temporality-dev
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"

  agent-kernel:
    build:
      context: .
      target: agent-kernel
      args:
        # The Lead/Coder/Reviewer/QA example routes are opt-in via build tag.
        KERNEL_BUILD_TAGS: agent_examples
    # Host uid/gid keeps sandbox workspace files owned by the local user and
    # makes the kernel pass that uid to sandbox containers. The Docker socket
    # is root:root inside the container (OrbStack/Docker Desktop proxy), so the
    # root group is required to connect.
    user: "${TEMPORALITY_UID:-10001}:${TEMPORALITY_GID:-10001}"
    group_add:
      - "0"
    environment:
      DATABASE_URL: postgres://temporality:temporality@postgres:5432/temporality?sslmode=disable
      TEMPORALITY_URL: http://journal:8080
      TEMPORAL_ADDRESS: temporal:7233
      KERNEL_HTTP_ADDR: :8090
      KERNEL_SOURCE_ID: ${KERNEL_SOURCE_ID:-temporality-agent-kernel}
      TEMPORALITY_MODEL_BASE_URL: ${TEMPORALITY_MODEL_BASE_URL:-}
      TEMPORALITY_MODEL_ID: ${TEMPORALITY_MODEL_ID:-}
      TEMPORALITY_MODEL_API_KEY: ${TEMPORALITY_MODEL_API_KEY:-}
      TEMPORALITY_MODEL_TEMPERATURE: ${TEMPORALITY_MODEL_TEMPERATURE:-0}
      TEMPORALITY_MODEL_TIMEOUT: ${TEMPORALITY_MODEL_TIMEOUT:-180s}
      TEMPORALITY_MODEL_MAX_OUTPUT_TOKENS: ${TEMPORALITY_MODEL_MAX_OUTPUT_TOKENS:-1024}
      TEMPORALITY_MODEL_REASONING: ${TEMPORALITY_MODEL_REASONING:-}
      KERNEL_MCP_COMMAND: ${KERNEL_MCP_COMMAND:-}
      KERNEL_MCP_ARGS: ${KERNEL_MCP_ARGS:-}
      KERNEL_MCP_ALLOW: ${KERNEL_MCP_ALLOW:-}
      KERNEL_MCP_APPROVAL: ${KERNEL_MCP_APPROVAL:-}
      # Bearer auth for the kernel API (same format as JOURNAL_AUTH_TOKENS).
      KERNEL_AUTH_TOKENS: ${KERNEL_AUTH_TOKENS:-}
      # Daily run quotas per project: "project:limit" comma list, "*" sets
      # the default. Empty disables quotas.
      KERNEL_RUN_QUOTAS: ${KERNEL_RUN_QUOTAS:-}
      # Token the kernel uses to ingest events into the journal and read hints;
      # needs at least writer role on the projects your runs target.
      TEMPORALITY_API_TOKEN: ${TEMPORALITY_API_TOKEN:-}
      # Optional MCP server identity recorded on mcp.call.* events.
      KERNEL_MCP_SERVER_NAME: ${KERNEL_MCP_SERVER_NAME:-}
      # Test MCP server workspace root (for live E2E validation).
      KERNEL_MCP_TEST_ROOT: ${KERNEL_MCP_TEST_ROOT:-}
      # Fault injection for reconciliation drills: the named operation's effect
      # really executes, then the worker dies before the terminal event lands.
      KERNEL_FAULT_AFTER_EFFECT: ${KERNEL_FAULT_AFTER_EFFECT:-}
      KERNEL_SANDBOX_ROOT: ${TEMPORALITY_SANDBOX_ROOT:-}
      KERNEL_SANDBOX_IMAGE: ${KERNEL_SANDBOX_IMAGE:-}
    ports:
      - "8090:8090"
    volumes:
      # The optional run_command sandbox shells out to the host Docker daemon;
      # sandbox workspaces bind-mount themselves into sibling containers, so
      # the sandbox root must exist at the same absolute path inside this
      # container and on the host (set TEMPORALITY_SANDBOX_ROOT in .env).
      - /var/run/docker.sock:/var/run/docker.sock
      # Sandbox workspace must be accessible to MCP servers running as
      # child processes of the kernel.
      - ${TEMPORALITY_SANDBOX_ROOT:-./.sandbox}:${TEMPORALITY_SANDBOX_ROOT:-./.sandbox}
      - type: bind
        source: ${TEMPORALITY_SANDBOX_ROOT:-/tmp}
        target: ${TEMPORALITY_SANDBOX_ROOT:-/tmp}
    depends_on:
      postgres:
        condition: service_healthy
      journal:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  temporality-postgres:
