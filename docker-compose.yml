services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: temporality
      POSTGRES_USER: temporality
      POSTGRES_PASSWORD: temporality
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporality -d temporality"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - temporality-postgres:/var/lib/postgresql/data

  runtime:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://temporality:temporality@postgres:5432/temporality?sslmode=disable
      HTTP_ADDR: :8080
      TEMPORALITY_MODEL_BASE_URL: ${TEMPORALITY_MODEL_BASE_URL:-}
      TEMPORALITY_MODEL_ID: ${TEMPORALITY_MODEL_ID:-}
      TEMPORALITY_MODEL_API_KEY: ${TEMPORALITY_MODEL_API_KEY:-}
      TEMPORALITY_MODEL_TEMPERATURE: ${TEMPORALITY_MODEL_TEMPERATURE:-0}
      TEMPORALITY_MODEL_TIMEOUT: ${TEMPORALITY_MODEL_TIMEOUT:-180s}
      TEMPORALITY_MODEL_MAX_OUTPUT_TOKENS: ${TEMPORALITY_MODEL_MAX_OUTPUT_TOKENS:-1024}
      TEMPORALITY_MODEL_REASONING: ${TEMPORALITY_MODEL_REASONING:-}
      TEMPORALITY_MODEL_LOG_PAYLOADS: ${TEMPORALITY_MODEL_LOG_PAYLOADS:-false}
      TEMPORALITY_MODEL_LOG_MAX_BYTES: ${TEMPORALITY_MODEL_LOG_MAX_BYTES:-65536}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  executor:
    build:
      context: .
      target: executor
    environment:
      DATABASE_URL: postgres://temporality:temporality@postgres:5432/temporality?sslmode=disable
      # Bind the executor to a World registered via POST /v1/worlds. When set,
      # read-only steps run through the world adapter and produce
      # world.observation events; when empty the safe filesystem adapter is used.
      WORLD_ID: ${TEMPORALITY_WORLD_ID:-}
    depends_on:
      runtime:
        condition: service_healthy
    restart: unless-stopped

  debugger:
    build:
      context: debugger
    ports:
      - "3000:80"
    depends_on:
      runtime:
        condition: service_healthy
    restart: unless-stopped

volumes:
  temporality-postgres:
