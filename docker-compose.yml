# Temporality stack. The primary deployment path is the prebuilt GHCR images:
#   TEMPORALITY_VERSION=2026.2.66 docker compose up -d
# (see the releases page; the kernel applies its migrations on start).
# This file never builds: compose pulls exactly the pinned version and fails
# loudly if it is missing. Local source builds live in docker-compose.dev.yml
# (see docs/user/quickstart.md).
services:
  postgres:
    image: pgvector/pgvector:pg17
    # pg_stat_statements: the load-test attribution source — which query
    # melts the database under a campaign (the journal melt-down of the
    # first heavy-100 had no other witness). The extension still needs a
    # one-time "CREATE EXTENSION pg_stat_statements;" after this changes.
    command: postgres -c shared_preload_libraries=pg_stat_statements
    # The whole stack crash-loops without the database: it must survive host
    # and daemon restarts like the services depending on it.
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporality
      POSTGRES_USER: temporality
      POSTGRES_PASSWORD: temporality
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporality -d temporality"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - temporality-postgres:/var/lib/postgresql/data

  journal:
    # Prebuilt image from GHCR; TEMPORALITY_VERSION pins it.
    image: ghcr.io/ruslangabbasov/temporality/journal:${TEMPORALITY_VERSION:-2026.2.66}
    environment:
      DATABASE_URL: postgres://temporality:temporality@postgres:5432/temporality?sslmode=disable
      HTTP_ADDR: :8080
      # Bearer auth for the journal API. Empty disables auth (local dev only).
      # Format: "token:subject:role:projects" entries separated by ';' or
      # newlines; projects is '*' or a comma list. Generate: openssl rand -hex 24
      JOURNAL_AUTH_TOKENS: ${JOURNAL_AUTH_TOKENS:-}
      # Debug listener INSIDE the container (counters + pprof), off by default.
      # Not published to the host: reach it via
      #   docker compose exec journal wget -qO- http://localhost:6060/debug/counters
      JOURNAL_DEBUG_ADDR: ${JOURNAL_DEBUG_ADDR:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  debugger:
    image: ghcr.io/ruslangabbasov/temporality/debugger:${TEMPORALITY_VERSION:-2026.2.66}
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      journal:
        condition: service_healthy
      agent-kernel:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:latest
    container_name: temporality-dev
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - "7233:7233"
      - "8233:8233"

  # Self-hosted meta-search backing the agents' web_search tool. JSON output
  # must stay enabled in searxng-settings.yml — the kernel parses format=json.
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8889:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Headless browser backing the agents' browser tool (docs/web-research.md
  # §4). Isolated on the browser network: it reaches the internet but not the
  # kernel, journal or database — the network-level SSRF answer for a browser
  # that fetches URLs on its own. The kernel joins both networks.
  lightpanda:
    image: lightpanda/browser:latest
    # advertise-host whitelists the docker-dns name for the CDP websocket
    # Host check (DNS-rebinding protection): the kernel dials lightpanda:9222.
    command: ["/bin/lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222", "--advertise-host", "lightpanda", "--log_level", "info"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - browser
    restart: unless-stopped

  agent-kernel:
    image: ghcr.io/ruslangabbasov/temporality/agent-kernel:${TEMPORALITY_VERSION:-2026.2.66}
    # The container starts as root only so docker-entrypoint.sh can pick up
    # the Docker socket's group at runtime (root:docker on Linux, root:root on
    # Docker Desktop/OrbStack) and drop to the unprivileged user below with
    # that group attached — no per-host GID configuration. TEMPORALITY_UID/GID
    # keep sandbox workspace files owned by the host user and are passed to
    # the kernel's sandbox containers. TEMPORALITY_DOCKER_GID overrides the
    # socket group detection for exotic setups.
    user: "0:0"
    environment:
      # Drop target for docker-entrypoint.sh (uid/gid of the host user keeps
      # sandbox workspace files owned by that user) plus the optional socket
      # group override; empty = detect from the socket at startup.
      TEMPORALITY_UID: "${TEMPORALITY_UID:-10001}"
      TEMPORALITY_GID: "${TEMPORALITY_GID:-10001}"
      TEMPORALITY_DOCKER_GID: "${TEMPORALITY_DOCKER_GID:-}"
      DATABASE_URL: postgres://temporality:temporality@postgres:5432/temporality?sslmode=disable
      TEMPORALITY_URL: http://journal:8080
      TEMPORAL_ADDRESS: temporal:7233
      KERNEL_HTTP_ADDR: :8090
      KERNEL_SOURCE_ID: ${KERNEL_SOURCE_ID:-temporality-agent-kernel}
      TEMPORALITY_MODEL_BASE_URL: ${TEMPORALITY_MODEL_BASE_URL:-}
      TEMPORALITY_MODEL_ID: ${TEMPORALITY_MODEL_ID:-}
      TEMPORALITY_MODEL_API_KEY: ${TEMPORALITY_MODEL_API_KEY:-}
      TEMPORALITY_MODEL_TEMPERATURE: ${TEMPORALITY_MODEL_TEMPERATURE:-0}
      TEMPORALITY_MODEL_TIMEOUT: ${TEMPORALITY_MODEL_TIMEOUT:-180s}
      TEMPORALITY_MODEL_STREAM_IDLE_TIMEOUT: ${TEMPORALITY_MODEL_STREAM_IDLE_TIMEOUT:-90s}
      TEMPORALITY_MODEL_STREAM_NO_PROGRESS_TIMEOUT: ${TEMPORALITY_MODEL_STREAM_NO_PROGRESS_TIMEOUT:-4m}
      TEMPORALITY_MODEL_FIRST_TOKEN_TIMEOUT: ${TEMPORALITY_MODEL_FIRST_TOKEN_TIMEOUT:-2m}
      TEMPORALITY_MODEL_ACTIVITY_TIMEOUT: ${TEMPORALITY_MODEL_ACTIVITY_TIMEOUT:-20m}
      # One run_command activity: must stay above the sandbox command ceiling
      # (KERNEL_TOOL_MAX_SECONDS, default 15m) — an activity timeout below it
      # kills long e2e/build commands while the sandbox is still running.
      TEMPORALITY_TOOL_ACTIVITY_TIMEOUT: ${TEMPORALITY_TOOL_ACTIVITY_TIMEOUT:-16m}
      KERNEL_TOOL_MAX_SECONDS: ${KERNEL_TOOL_MAX_SECONDS:-900}
      TEMPORALITY_MODEL_MAX_OUTPUT_TOKENS: ${TEMPORALITY_MODEL_MAX_OUTPUT_TOKENS:-1024}
      TEMPORALITY_MODEL_REASONING: ${TEMPORALITY_MODEL_REASONING:-}
      KERNEL_MCP_COMMAND: ${KERNEL_MCP_COMMAND:-}
      KERNEL_MCP_ARGS: ${KERNEL_MCP_ARGS:-}
      KERNEL_MCP_ALLOW: ${KERNEL_MCP_ALLOW:-}
      KERNEL_MCP_APPROVAL: ${KERNEL_MCP_APPROVAL:-}
      # Bearer auth for the kernel API (same format as JOURNAL_AUTH_TOKENS).
      KERNEL_AUTH_TOKENS: ${KERNEL_AUTH_TOKENS:-}
      # Daily run quotas per project: "project:limit" comma list, "*" sets
      # the default. Empty disables quotas.
      KERNEL_RUN_QUOTAS: ${KERNEL_RUN_QUOTAS:-}
      # Model cost prices: "model:prompt_per_1k:completion_per_1k" comma list.
      # Example: KERNEL_MODEL_PRICES="gpt-4o:2.50:10.00,claude-3-sonnet:3.00:15.00"
      KERNEL_MODEL_PRICES: ${KERNEL_MODEL_PRICES:-}
      # Token the kernel uses to ingest events into the journal and read hints;
      # needs at least writer role on the projects your runs target.
      # Optional: when empty (or rejected by the journal) the kernel
      # auto-provisions a "temporality-kernel" service principal in the
      # shared workspace DB — the journal picks it up on its token reload.
      TEMPORALITY_API_TOKEN: ${TEMPORALITY_API_TOKEN:-}
      # Envelope-encryption key for workspace secrets (32 bytes, hex or
      # base64). Generate: openssl rand -hex 32. Required only when secrets
      # with provider=builtin exist; missing key logs a warning.
      KERNEL_SECRET_MASTER_KEY: ${KERNEL_SECRET_MASTER_KEY:-}
      # How long resolved secret values stay cached in memory (seconds).
      KERNEL_SECRET_CACHE_TTL_SECONDS: ${KERNEL_SECRET_CACHE_TTL_SECONDS:-}
      # Optional MCP server identity recorded on mcp.call.* events.
      KERNEL_MCP_SERVER_NAME: ${KERNEL_MCP_SERVER_NAME:-}
      # Test MCP server workspace root (for live E2E validation).
      KERNEL_MCP_TEST_ROOT: ${KERNEL_MCP_TEST_ROOT:-}
      # Fault injection for reconciliation drills: the named operation's effect
      # really executes, then the worker dies before the terminal event lands.
      # really executes, then the worker dies before the terminal event lands.
      KERNEL_FAULT_AFTER_EFFECT: ${KERNEL_FAULT_AFTER_EFFECT:-}
      # Sandbox root MUST live on a persistent host path: it holds every
      # project's /workspace (agent files, chat artifacts). The old /tmp
      # default was wiped by host reboots (systemd-tmpfiles) and took the
      # workspaces with it.
      KERNEL_SANDBOX_ROOT: ${TEMPORALITY_SANDBOX_ROOT:-/srv/temporality/sandbox}
      KERNEL_SANDBOX_IMAGE: ${KERNEL_SANDBOX_IMAGE:-${TEMPORALITY_SANDBOX_IMAGE:-}}
      # Sandbox resource knobs (optional): the pids limit was a hardcoded 128,
      # which broke real development work (go test fans out dozens of
      # processes); 512 fits it, raise further via .env if needed.
      KERNEL_SANDBOX_PIDS: ${KERNEL_SANDBOX_PIDS:-}
      # Outbound notification channels (docs/triggers-and-escalations.md §7,
      # docs/channels.md §6): transports the kernel uses to deliver ask_human
      # questions to users. Canonical names first (KERNEL_CHANNEL__<TYPE>__<FIELD>),
      # legacy names below keep working as aliases of the same fields.
      KERNEL_CHANNEL__MATRIX__HOMESERVER: ${KERNEL_CHANNEL__MATRIX__HOMESERVER:-}
      KERNEL_CHANNEL__MATRIX__ACCESS_TOKEN: ${KERNEL_CHANNEL__MATRIX__ACCESS_TOKEN:-}
      KERNEL_CHANNEL__TELEGRAM__BOT_TOKEN: ${KERNEL_CHANNEL__TELEGRAM__BOT_TOKEN:-}
      KERNEL_CHANNEL__WEBHOOK__SECRET: ${KERNEL_CHANNEL__WEBHOOK__SECRET:-}
      KERNEL_MATRIX_HOMESERVER: ${KERNEL_MATRIX_HOMESERVER:-}
      KERNEL_MATRIX_ACCESS_TOKEN: ${KERNEL_MATRIX_ACCESS_TOKEN:-}
      KERNEL_TELEGRAM_BOT_TOKEN: ${KERNEL_TELEGRAM_BOT_TOKEN:-}
      # Shared secret signing generic webhook channel payloads
      # (X-Temporality-Signature header). Optional: unset sends unsigned.
      KERNEL_WEBHOOK_SECRET: ${KERNEL_WEBHOOK_SECRET:-}
      # Base URL of the debugger UI, used for links inside notifications.
      KERNEL_UI_URL: ${KERNEL_UI_URL:-}
      # Web research tools: SearXNG backs web_search (empty disables the tool
      # while web_fetch keeps working); AllowPrivate lets web_fetch reach
      # internal hosts (docs servers) — off by default, SSRF guard stays strict.
      # Semantic knowledge layer (docs/supervisor-model.md §6): embeddings run
      # IN-PROCESS (pure-Go rembed, multilingual-e5-small); the model downloads
      # once into the cache volume below.
      KERNEL_EMBEDDINGS_MODEL: ${KERNEL_EMBEDDINGS_MODEL:-intfloat/multilingual-e5-small}
      REMBED_CACHE: /var/cache/rembed
      KERNEL_SEARXNG_URL: ${KERNEL_SEARXNG_URL:-http://searxng:8080}
      KERNEL_WEB_FETCH_ALLOW_PRIVATE: ${KERNEL_WEB_FETCH_ALLOW_PRIVATE:-}
      # Process-global web_search budget: search engines ban the server IP,
      # and each SearXNG query fans out into dozens of engine requests.
      KERNEL_WEB_SEARCH_PER_MIN: ${KERNEL_WEB_SEARCH_PER_MIN:-30}
      # Headless browser backend (CDP) for the browser tool: empty disables
      # the tool. The endpoint is operator-configured (like SearXNG) and sits
      # on the isolated browser network.
      KERNEL_BROWSER_CDP_URL: ${KERNEL_BROWSER_CDP_URL:-http://lightpanda:9222}
      # Process-global browser action budget (default 60/min).
      KERNEL_BROWSER_PER_MIN: ${KERNEL_BROWSER_PER_MIN:-60}
    ports:
      - "8090:8090"
    volumes:
      # The optional run_command sandbox shells out to the host Docker daemon;
      # sandbox workspaces bind-mount themselves into sibling containers, so
      # the sandbox root must exist at the same absolute path inside this
      # container and on the host. The default /srv/temporality/sandbox is a
      # persistent host directory (create it before first start; the kernel
      # chowns what it needs) — /tmp was volatile and wiped project
      # workspaces on every host reboot. Kubernetes deployments replace this
      # bind-mount with a Job-based runner + PVC (docs/sandbox-profiles.md
      # §13, roadmap).
      - /var/run/docker.sock:/var/run/docker.sock
      # In-process embedding model cache (semantic knowledge layer): weights
      # download once and persist across container restarts.
      - rembed_cache:/var/cache/rembed
      # Sandbox workspace must be accessible to MCP servers running as
      # child processes of the kernel. The host directory must exist before
      # start (mkdir -p /srv/temporality/sandbox) — compose does not create
      # host bind-mount sources.
      - ${TEMPORALITY_SANDBOX_ROOT:-/srv/temporality/sandbox}:${TEMPORALITY_SANDBOX_ROOT:-/srv/temporality/sandbox}
    networks:
      - default
      - browser
    depends_on:
      postgres:
        condition: service_healthy
      journal:
        condition: service_healthy
      temporal:
        condition: service_started
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Egress proxy (docs/agent-behavior-monitoring.md §7): the only container
  # attached to both the internal sandbox network (no internet route) and the
  # outside. Its squid config is generated by the agent-kernel from agent
  # egress allowlists (KERNEL_SANDBOX_ROOT/egress/squid.conf) and reloaded
  # without a restart. Sandboxes receive HTTP(S)_PROXY pointing at their
  # dedicated port; the port is the policy.
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: temporality-egress-proxy
    volumes:
      # The kernel writes squid.conf into the sandbox root's egress/ dir.
      - ${TEMPORALITY_SANDBOX_ROOT:-/srv/temporality/sandbox}/egress:/etc/squid:ro
    networks:
      - egress-internal
      - egress-out
    restart: unless-stopped

  # Nightly backup loop (docs/user/administration.md «Резервное копирование»):
  # opt-in via the backup compose profile. Dumps PostgreSQL and tars the
  # sandbox root into ./backups, keeping 14 of each. Restore with
  # scripts/restore.sh <db-dump> <sandbox.tar.gz>.
  backup:
    image: pgvector/pgvector:pg17
    profiles: [backup]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: temporality
      PGPASSWORD: temporality
      PGDATABASE: temporality
    volumes:
      - ./backups:/backups
      - ${TEMPORALITY_SANDBOX_ROOT:-/srv/temporality/sandbox}:/sandbox:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          ts=$$(date +%Y%m%d-%H%M)
          pg_dump | gzip > "/backups/db-$$ts.sql.gz"
          tar czf "/backups/sandbox-$$ts.tar.gz" -C /sandbox .
          ls -1t /backups/db-*.sql.gz | tail -n +15 | xargs -r rm -f
          ls -1t /backups/sandbox-*.tar.gz | tail -n +15 | xargs -r rm -f
          echo "backup $$ts done"
          sleep 86400
        done
    restart: unless-stopped

volumes:
  rembed_cache:
  temporality-postgres:

networks:
  # The browser backend must not see the internal services (journal, postgres,
  # temporal): only the kernel joins this network alongside the default one.
  browser: {}
  # Egress control (docs/agent-behavior-monitoring.md §7): sandboxes attach to
  # the internal network (docker --internal — no route to the internet or the
  # LAN); the egress-proxy is the only container with an outside connection.
  # Explicit names (no compose prefix) — the agent-kernel inspects/manages
  # these networks by name.
  egress-internal:
    name: temporality-sandbox-internal
    internal: true
  egress-out: {}
