name: CI

# Every PR and every push to main must pass the same gates the release
# pipeline will see: Go tests, the debugger build chain and the docs build.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./... -timeout 20m

  debugger:
    name: Debugger build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debugger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: debugger/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docs:
    name: Docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:docs
      - name: Generated docs are committed
        run: git diff --exit-code pages/docs
