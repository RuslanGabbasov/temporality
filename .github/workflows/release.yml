name: Release

# A version tag (v2026.1.0) builds the three service images, publishes them to
# GHCR and creates a GitHub Release with the changelog generated from commits.
# Versioning: calendar scheme YYYY.MINOR.PATCH (e.g. v2026.1.0); bump MINOR for
# feature drops within the year, PATCH for fixes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build & publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push agent-kernel
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent-kernel
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KERNEL_BUILD_TAGS=agent_examples
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.repo }}/agent-kernel:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}/agent-kernel:v${{ steps.meta.outputs.version }}

      - name: Build & push journal
        uses: docker/build-push-action@v6
        with:
          context: .
          target: journal
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.repo }}/journal:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}/journal:v${{ steps.meta.outputs.version }}

      - name: Build & push debugger UI
        uses: docker/build-push-action@v6
        with:
          context: debugger
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}/debugger:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}/debugger:v${{ steps.meta.outputs.version }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Changelog from commits since the previous tag
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            git log --no-merges --pretty='format:- %s (%h)' "${previous}..${GITHUB_REF_NAME}" > CHANGELOG_BODY.md
          else
            git log --no-merges --pretty='format:- %s (%h)' "${GITHUB_REF_NAME}" > CHANGELOG_BODY.md
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG_BODY.md
          generate_release_notes: true
