server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://journal:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Knowledge projection and hint retrieval walk the whole event history
        # of a project; keep the proxy timeout generous so the journal can
        # return complete results instead of a truncated proxy error.
        proxy_connect_timeout 10s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
        send_timeout 10m;
    }

    location /kernel-api/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
    }

    location / {
        try_files $uri /index.html;
    }
}
