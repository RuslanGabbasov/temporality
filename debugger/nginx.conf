server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://journal:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Knowledge projection and hint retrieval walk the whole event history
        # of a project; keep the proxy timeout generous so the journal can
        # return complete results instead of a truncated proxy error.
        proxy_connect_timeout 10s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
        send_timeout 10m;
    }

    location /kernel-api/ {
        # Run ids live in the path and contain slashes (…/delegate/01): the UI
        # sends them percent-encoded, and the kernel's ServeMux wildcard matches
        # them as ONE segment. proxy_pass with a URI part would forward the
        # DECODED path, turning %2F into real slashes and 404ing every
        # child-run endpoint (nudge/approval/cancel). Rebuild the upstream URI
        # from the raw $request_uri instead — it keeps the escaping intact.
        set $kernel_path "";
        if ($request_uri ~ ^/kernel-api([^?]*)) {
            set $kernel_path $1;
        }
        # Variable proxy_pass resolves the upstream at request time — point
        # nginx at Docker's embedded DNS.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        proxy_pass http://agent-kernel:8090$kernel_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
        # Chat file uploads (POST …/files) — must match the kernel's own
        # 200MB multipart cap, nginx defaults to just 1MB.
        client_max_body_size 200m;
    }

    location / {
        try_files $uri /index.html;
    }
}
