server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://journal:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Knowledge projection and hint retrieval walk the whole event history
        # of a project; keep the proxy timeout generous so the journal can
        # return complete results instead of a truncated proxy error.
        proxy_connect_timeout 10s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
        send_timeout 10m;
    }

    location /kernel-api/ {
        # Run ids live in the path and contain slashes (.../delegate/01).
        # proxy_pass WITH a URI part (…:8090/) forwards the decoded path —
        # %2F becomes real slashes and the kernel's single-segment wildcard
        # 404s; with a variable URI nginx re-escapes % into %25 and PathValue
        # comes back still-encoded, hashing a wrong workflow id. Passing the
        # ORIGINAL request URI untouched (no URI part at all) keeps the
        # escaping byte-for-byte; the kernel strips the /kernel-api prefix
        # itself (see the root handler in cmd/agent-kernel/main.go).
        proxy_pass http://agent-kernel:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10m;
        proxy_read_timeout 10m;
        # Chat file uploads (POST …/files) — must match the kernel's own
        # 200MB multipart cap, nginx defaults to just 1MB.
        client_max_body_size 200m;
    }

    location / {
        try_files $uri /index.html;
    }
}
