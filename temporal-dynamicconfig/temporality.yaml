# Temporal dynamic config of the temporality stack (docker-compose.yml mounts
# this file). Carries over, 1:1, the two --dynamic-config-value flags the
# start-dev command used to set: every call_model activity input (the full
# message array, screenshots included) is part of the workflow history, so a
# long agentic run crosses the default 50 MB limit and the server TERMINATES
# it mid-work (the 2026-11-09 incident). The ceilings here keep such runs
# alive; the structural fix (ContinueAsNew at compaction boundaries) is
# tracked in docs/context-compaction.md.
#
# Format note: the file-based client of Temporal >= 1.24 only accepts the
# constrained-values form — every key maps to a list of {constraints, value}
# entries. The old flat scalar form (`limit.historySize.error: 524288000`)
# fails the decode with "cannot unmarshal !!int into []struct {…}" and the
# server refuses to start.
limit.historySize.error:
  - constraints: {}
    value: 524288000
limit.historySize.warn:
  - constraints: {}
    value: 104857600
