# Development overlay: local source builds for the three service images.
# Deployment never needs this file — the base docker-compose.yml pulls the
# prebuilt GHCR images. Usage (from a repository checkout):
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# The overlay only adds the build sections; everything else (env, ports,
# healthchecks) comes from the base file. A plain `docker compose up` on a
# repository checkout stays pull-only by design: it can never silently
# downgrade a pinned TEMPORALITY_VERSION to a locally compiled image.
#
# Building next to a live stack is the memory spike that killed a 32 GiB
# host once (2026-10-30): go build spawns one compiler process per core and
# vite holds the whole module graph in one heap. The images accept caps:
#   docker build --build-arg GOFLAGS="-p=2" --target agent-kernel .
#   docker build --build-arg NPM_MAX_OLD_SPACE=2048 debugger
# The deployment path needs none of this — pull the published images.
services:
  journal:
    build:
      context: .
      target: journal

  debugger:
    build:
      context: debugger

  agent-kernel:
    build:
      context: .
      target: agent-kernel
      args:
        # The Lead/Coder/Reviewer/QA example routes are opt-in via build tag.
        KERNEL_BUILD_TAGS: agent_examples

  # Load-testing mock provider (docs/resilience-and-scale.md §НТ): activated
  # only with --profile loadtest; the kernel's TEMPORALITY_MODEL_BASE_URL
  # points at it during a load campaign (http://mockllm:8081/v1).
  mockllm:
    build:
      context: .
      dockerfile: examples/mockllm/Dockerfile
    profiles: [loadtest]
    ports:
      - "8081:8081"
    # Heavy-profile knobs (docs/resilience-and-scale.md §НТ): the default is
    # the light profile; scripts/loadrun.sh --heavy documents the heavy env.
    environment:
      MOCKLLM_FIRST_TOKEN: ${MOCKLLM_FIRST_TOKEN:-200ms}
      MOCKLLM_TOKEN_GAP: ${MOCKLLM_TOKEN_GAP:-15ms}
      MOCKLLM_TOKENS: ${MOCKLLM_TOKENS:-120}
      MOCKLLM_TOOL_COMMAND: ${MOCKLLM_TOOL_COMMAND:-echo loadgen step}
      MOCKLLM_ASK_AFTER_TOOLS: ${MOCKLLM_ASK_AFTER_TOOLS:-0}
    restart: unless-stopped
